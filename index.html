<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niger State Life</title>
<style>
:root{--bg:#eef2ea;--card:#fff;--ink:#14231c;--mute:#5b6b62;--green:#0f3d2e;--brass:#c8932b;--clay:#b5502d;--river:#2a7f8e;--line:#d5ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f18;--card:#132e24;--ink:#e8efe9;--mute:#98ab9f;--line:#24453a;--green:#2f8f6b}}
:root[data-theme="dark"]{--bg:#0b1f18;--card:#132e24;--ink:#e8efe9;--mute:#98ab9f;--line:#24453a;--green:#2f8f6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;max-width:520px;margin-inline:auto;padding:12px}
h1{font:800 26px/1.1 Georgia,serif;margin:4px 0 2px;color:var(--green)}
h2{font:700 17px Georgia,serif;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--mute);font-size:12px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 12px;background:var(--green);color:#fff;cursor:pointer;min-height:40px}
button.alt{background:var(--brass);color:#1a1405}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.towns{display:flex;gap:6px;flex-wrap:wrap}
.towns button{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.towns button.on{border-color:var(--brass);background:var(--brass);color:#1a1405}
.ad{border:2px dashed var(--brass);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--mute);margin-bottom:12px}
.ad b{display:block;color:var(--clay);font-size:15px}
#log p{margin:4px 0;font-size:14px}
#log p:first-child{font-weight:700}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;color:var(--mute);font-weight:400;min-height:0;padding:0;text-decoration:underline}
</style>
</head>
<body><canvas id="world" width="360" height="500" style="display:block;width:100%;max-width:500px;margin:auto;border-radius:12px;background:#8fbd78"></canvas>
<div id="app"></div>
<script>
var TOWNS={
minna:{n:"Minna",d:"State capital. Bosso, Tunga, FUT Minna and the big market.",
jobs:[["Keke rider",2500,25,15],["Trader at Minna market",2000,20,12],["Sell recharge cards at FUT",1700,15,10]],
food:[
["Tuwo and miyan kuka",800,40],
["Suya",1500,30],
["Jollof rice",1200,40],
["Shawarma",2500,35],
["Eba and egusi soup",1000,45]
],
ad:"Minna businesses: your shop on this billboard"},
bida:{n:"Bida",d:"Old Nupe emirate town. Brass, glass and farmland.",
jobs:[["Brass worker",3200,30,18],["Farmer",2200,28,16],["Fura da nono seller",1800,15,10]],
food:[["Gbegi and egusi",900,40],["Fura da nono",500,20]],
ad:"Bida brass makers and caterers: advertise here"},
suleja:{n:"Suleja",d:"Next to Abuja. Madalla and Zuma Rock are close.",
jobs:[["Bus conductor to Abuja",2600,22,14],["Trader at Madalla",2300,20,12],["Zuma Rock tour guide",3000,22,12]],
food:[["Jollof and chicken",1800,45],["Akara and pap",600,25]],
ad:"Suleja events and brands: reach every commuter"}
};
var FARE={"minna-bida":2000,"minna-suleja":3000,"bida-suleja":4500};
var HOMES=[["Sleep outside",0,50],["Single room",1500,100],["Self-contain",4000,100],["Two-bedroom flat",10000,100]];
var S=null,KEY="nigerStateLifeV1";
function load(){try{var v=localStorage.getItem(KEY);if(v)S=JSON.parse(v)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ng(n){return"\u20A6"+Math.round(n).toLocaleString("en-NG")}
function say(t){S.log.unshift(t);S.log=S.log.slice(0,6)}
function clamp(v){return Math.max(0,Math.min(100,v))}
function mult(){return 1+Math.floor(S.xp/8)*0.1}
function start(t){var c=t=='alhaji'?50000:1500;var n=document.getElementById("nm").value.trim();if(!n)return;
S={name:n,cash:c,energy:100,food:80,day:1,town:"minna",home:t=='alhaji'?1:0,xp:0,log:["Welcome to Minna, "+n+". "+(t=='alhaji'?"You are an Alhaji's child and start comfortable with ":"You are on the hustle (Talaka) with only ")+ng(c)+"."]};save();draw()}
function work(i){var j=TOWNS[S.town].jobs[i];
if(S.energy<j[2]){say("Too tired for "+j[0]+". Sleep first.");return draw()}
if(S.food<10){say("Too hungry to work. Eat something.");return draw()}
var pay=j[1]*mult();
if(Math.random()<0.2){var tip=Math.round(pay*0.3);pay+=tip;say("A customer tipped you "+ng(tip)+".")}
S.cash+=pay;S.energy=clamp(S.energy-j[2]);S.food=clamp(S.food-j[3]);S.xp++;
say(j[0]+": earned "+ng(pay)+".");save();draw()}
function eat(i){var f=TOWNS[S.town].food[i];
if(S.cash<f[1]){say("Not enough cash for "+f[0]+".");return draw()}
S.cash-=f[1];S.food=clamp(S.food+f[2]);say("You ate "+f[0]+" for "+ng(f[1])+".");save();draw()}
function sleep(){var h=HOMES[S.home];
if(S.cash<h[1]){say("You can't afford "+h[0]+" tonight.");return draw()}
S.cash-=h[1];S.energy=clamp(S.energy+h[2]);S.food=clamp(S.food-20);S.day++;
say("Day "+S.day+". Slept at: "+h[0]+(h[1]?" ("+ng(h[1])+")":"")+".");
if(S.home==0&&Math.random()<0.25){var l=Math.min(S.cash,1000);S.cash-=l;if(l)say("Someone took "+ng(l)+" while you slept outside.")}
save();draw()}
function home(i){S.home=i;say("Home set to: "+HOMES[i][0]+".");save();draw()}
function go(t){if(t==S.town)return;
var k=[S.town,t].sort().join("-"),c=FARE[k];
if(S.cash<c){say("Fare to "+TOWNS[t].n+" is "+ng(c)+". You are short.");return draw()}
S.cash-=c;S.energy=clamp(S.energy-10);S.town=t;say("You travelled to "+TOWNS[t].n+" ("+ng(c)+").");save();draw()}
function reset(){if(confirm("Start over? Your progress will be lost.")){S=null;try{localStorage.removeItem(KEY)}catch(e){}draw()}}
function bar(l,v,c){return'<div><small>'+l+" "+Math.round(v)+'%</small><div class="bar"><i style="width:'+v+"%;background:"+c+'"></i></div></div>'}
function draw(){var a=document.getElementById("app");
if(!S){a.innerHTML='<h1>Niger State Life</h1><p class="sub">Live a virtual life in Minna, Bida and Suleja.</p><div class="card"><h2>Create your character</h2><label for="nm">Your name</label><input id="nm" maxlength="20" placeholder="e.g. Musa"><button onclick="start(\'alhaji\')" style="width:100%;margin-bottom:8px">Alhaji child (start with \u20A650,000)</button><button class="alt" onclick="start(\'talaka\')" style="width:100%">Talaka hustle (start with \u20A61,500)</button></div>';return}
var T=TOWNS[S.town],h="";
h+='<div class="top"><h1>Niger State Life</h1><button class="link" onclick="reset()">Reset</button></div>';
h+='<p class="sub">'+S.name+" \u2022 Day "+S.day+" \u2022 Pay bonus x"+mult().toFixed(1)+'</p>';
h+='<div class="card"><h2>'+ng(S.cash)+'</h2><div class="stats">'+bar("Energy",S.energy,"var(--river)")+bar("Fullness",S.food,"var(--brass)")+'</div></div>';
h+='<div class="card"><h2>Travel</h2><div class="towns">';
for(var k in TOWNS)h+='<button class="'+(k==S.town?"on":"")+'" onclick="go(\''+k+'\')">'+TOWNS[k].n+'</button>';
h+='</div><p class="sub" style="margin:8px 0 0">'+T.d+' Fares: Minna\u2013Bida '+ng(2000)+', Minna\u2013Suleja '+ng(3000)+', Bida\u2013Suleja '+ng(4500)+'.</p></div>';
h+='<div class="ad"><b>Billboard</b>'+T.ad+'</div>';
h+='<div class="card"><h2>Jobs in '+T.n+'</h2>';
T.jobs.forEach(function(j,i){h+='<div class="row"><div>'+j[0]+'<small>Pays '+ng(j[1]*mult())+' \u2022 uses '+j[2]+' energy</small></div><button onclick="work('+i+')">Work</button></div>'});
h+='</div><div class="card"><h2>Food</h2>';
T.food.forEach(function(f,i){h+='<div class="row"><div>'+f[0]+'<small>'+ng(f[1])+' \u2022 +'+f[2]+' fullness</small></div><button class="alt" onclick="eat('+i+')">Eat</button></div>'});
h+='</div><div class="card"><h2>Home</h2>';
HOMES.forEach(function(x,i){h+='<div class="row"><div>'+x[0]+'<small>'+(x[1]?ng(x[1])+" per night":"Free, but risky")+'</small></div><button class="'+(S.home==i?"":"alt")+'" onclick="home('+i+')" '+(S.home==i?"disabled":"")+'>'+(S.home==i?"Living here":"Move in")+'</button></div>'});
h+='<button style="width:100%;margin-top:10px" onclick="sleep()">Sleep until morning</button></div>';
h+='<div class="card" id="log"><h2>What happened</h2>'+S.log.map(function(t){return"<p>"+t+"</p>"}).join("")+'</div>';
a.innerHTML=h}
var world=document.getElementById("world");
var ctx=world.getContext("2d");
var px=180,py=250;

function drawWorld(){function drawWorld(){
  ctx.clearRect(0,0,360,500);

  // Grass
  ctx.fillStyle="#8fbd78";
  ctx.fillRect(0,0,360,500);

  // Roads
  ctx.fillStyle="#777b78";
  ctx.fillRect(135,0,70,500);
  ctx.fillRect(0,205,360,90);

  // Road markings
  ctx.strokeStyle="#f6e9a9";
  ctx.lineWidth=2;
  ctx.setLineDash([12,10]);
  ctx.beginPath();
  ctx.moveTo(170,0);
  ctx.lineTo(170,200);
  ctx.moveTo(170,300);
  ctx.lineTo(170,500);
  ctx.stroke();
  ctx.setLineDash([]);

  // Market stalls
  function stall(x,y,w,h,roof,name){
    ctx.fillStyle="#e8d4b0";
    ctx.fillRect(x,y,w,h);

    ctx.fillStyle=roof;
    ctx.fillRect(x-4,y-12,w+8,18);

    for(let i=0;i<4;i++){
      ctx.fillStyle=i%2===0?"#fff0d4":"#a94f32";
      ctx.fillRect(x+i*w/4,y-12,w/4,18);
    }

    ctx.fillStyle="#865333";
    ctx.fillRect(x,y+h-18,w,18);

    for(let i=0;i<4;i++){
      ctx.fillStyle=["#e8a72c","#b63b27","#438c42","#f4d65b"][i];
      ctx.beginPath();
      ctx.arc(x+12+i*(w-24)/3,y+h-26,5,0,Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle="#fff8df";
    ctx.fillRect(x+3,y+4,w-6,15);
    ctx.fillStyle="#35261b";
    ctx.font="bold 9px Arial";
    ctx.fillText(name,x+7,y+15);
  }

  stall(12,30,95,75,"#bd3c25","FRESH FOOD");
  stall(245,30,100,75,"#d49b32","LOCAL MARKET");

  // Buildings
  function building(x,y,w,h,wall,roof,name){
    ctx.fillStyle=roof;
    ctx.fillRect(x-5,y-10,w+10,25);

    ctx.fillStyle=wall;
    ctx.fillRect(x,y+5,w,h-5);

    ctx.fillStyle="#f1dfb8";
    ctx.fillRect(x+8,y+20,20,20);
    ctx.fillRect(x+w-28,y+20,20,20);

    ctx.fillStyle="#67452f";
    ctx.fillRect(x+w/2-7,y+h-25,14,25);

    ctx.fillStyle="#fff";
    ctx.font="bold 10px Arial";
    ctx.fillText(name,x+5,y+17);
  }

  building(15,340,100,70,"#d8bd91","#8b5133","HOUSE");
  building(235,340,110,70,"#e3d6a5","#b84b35","HOSPITAL");

  // Trees
  for(let i=0;i<7;i++){
    let x=20+i*50;

    ctx.fillStyle="#76502d";
    ctx.fillRect(x-3,145,6,17);

    ctx.fillStyle="#286b3b";
    ctx.beginPath();
    ctx.arc(x,140,13,0,Math.PI*2);
    ctx.fill();
  }

  // Player
  ctx.fillStyle="#183dca";
  ctx.beginPath();
  ctx.arc(px,py,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="11px Arial";
  ctx.textAlign="center";
  ctx.fillText(S?S.name:"YOU",px,py-15);
  ctx.textAlign="left";

  ctx.fillStyle="#14231c";
  ctx.font="12px Arial";
  ctx.fillText("MINNA • Explore your city",8,490);
}
ctx.fillStyle="#8fbd78";
ctx.fillRect(0,0,360,500);

// Roads
ctx.fillStyle="#b8b8a8";
ctx.fillRect(0,205,360,90);
ctx.fillRect(135,0,70,500);

// Buildings
function building(x,y,w,h,c,name){
ctx.fillStyle=c;
ctx.fillRect(x,y,w,h);
ctx.fillStyle="#fff";
ctx.font="10px Arial";
ctx.fillText(name,x+5,y+15);
ctx.fillStyle="#59402b";
ctx.fillRect(x+w/2-5,y+h-15,10,15);
}
building(15,25,100,65,"#d69b61","MARKET");
building(230,25,110,65,"#e5d7ae","SHOP");
building(15,330,100,75,"#d9c5a0","HOUSE");
building(230,330,110,75,"#d69b61","HOSPITAL");

// Trees
for(var i=0;i<8;i++){
ctx.fillStyle="#286b3b";
ctx.beginPath();
ctx.arc(20+i*43,160,10,0,Math.PI*2);
ctx.fill();
}

// Player
ctx.fillStyle="#183dca";
ctx.beginPath();
ctx.arc(px,py,10,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="#fff";
ctx.font="11px Arial";
ctx.textAlign="center";
ctx.fillText(S?S.name:"YOU",px,py-15);
ctx.textAlign="left";

ctx.fillStyle="#14231c";
ctx.font="12px Arial";
ctx.fillText("MINNA • Explore your city",8,490);
}
world.addEventListener("click",function(e){
world.addEventListener("click",function(e){
var r=world.getBoundingClientRect();
var x=(e.clientX-r.left)*360/r.width;
var y=(e.clientY-r.top)*500/r.height;
px=Math.max(10,Math.min(350,x));
py=Math.max(10,Math.min(470,y));
drawWorld();
});

drawWorld();load();draw();
</script>
</body>
</html>
