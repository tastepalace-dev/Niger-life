function prizeHTML(){let p=AUTH.prize,r=[];r.push("💰 "+money(p.cash));r.push("🏠 "+HOMES[p.home][0]);if(p.items)Object.keys(p.items).forEach(k=>{let v=VEH.find(x=>x[0]===k);if(v)r.push(v[3]+" "+v[1])});if(p.biz)r.push("🏪 Provision store");if(p.learn)r.push("🎓 Computer training");return `<div style="text-align:center"><div style="font-size:54px">${p.emoji}</div><h2 style="margin:4px 0">${esc(p.title)}</h2><p class="muted">${esc(p.desc)}</p><div>${r.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div><button class="big" style="margin-top:14px" onclick="beginGame()">Start my life</button>`}
function startWheel(){if(AUTH.spinning||AUTH.prize)return;AUTH.spinning=true;let b=document.getElementById("spinBtn");if(b)b.disabled=true;let n=PRIZES.length,seg=6.2832/n,tot=PRIZES.reduce((a,p)=>a+p.w,0),r=Math.random()*tot,k=0;for(;k<n;k++){r-=PRIZES[k].w;if(r<=0)break}k=Math.min(k,n-1);let from=AUTH.wang||0,fin=-Math.PI/2-(k+.5)*seg+6.2832*8;while(fin<from+31)fin+=6.2832;let t0=performance.now(),dur=5400,last=-1;function step(t){let p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3.4);AUTH.wang=from+(fin-from)*e;drawWheel(AUTH.wang);let idx=Math.floor((((-Math.PI/2-AUTH.wang)%6.2832)+6.2832)%6.2832/seg);if(idx!==last){last=idx;beep()}if(p<1)requestAnimationFrame(step);else{AUTH.spinning=false;AUTH.prize=PRIZES[k];let s=document.getElementById("spinSheet");if(s)s.innerHTML=prizeHTML()}}requestAnimationFrame(step)}
function drawWheel(ang){let c=document.getElementById("wheel");if(!c)return;let g=c.getContext("2d"),n=PRIZES.length,seg=6.2832/n,cols=["#22b573","#f4b400","#e8505b","#3b82f6","#a855f7","#14b8a6","#f97316","#84cc16","#ec4899","#0ea5e9"];g.clearRect(0,0,300,300);g.save();g.translate(150,150);g.rotate(ang);for(let i=0;i<n;i++){g.beginPath();g.moveTo(0,0);g.arc(0,0,138,i*seg,(i+1)*seg);g.closePath();g.fillStyle=cols[i%cols.length];g.fill();g.strokeStyle="#fff";g.lineWidth=3;g.stroke();g.save();g.rotate(i*seg+seg/2);g.fillStyle="#fff";g.font="bold 11px Arial";g.textAlign="right";g.fillText(PRIZES[i].label,122,4);g.restore()}g.restore();g.fillStyle="#fff";g.beginPath();g.arc(150,150,26,0,6.3);g.fill();g.fillStyle="#1c2233";g.font="bold 11px Arial";g.textAlign="center";g.fillText("NIGER",150,148);g.fillText("LIFE",150,160);g.fillStyle="#1c2233";g.beginPath();g.moveTo(150,26);g.lineTo(137,2);g.lineTo(163,2);g.closePath();g.fill()}

function showGiftPopup(amount){
  let o=document.createElement("div");
  o.id="giftPopup";
  o.style.cssText="position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px";
  o.innerHTML=`<div style="background:#fff;border-radius:24px;padding:28px 24px;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)">
    <div style="font-size:64px;margin-bottom:8px">🎁</div>
    <h2 style="margin:0 0 8px;color:#245b3e">Niger Life Gift!</h2>
    <p style="font-size:18px;margin:8px 0;color:#203126">Niger Life just gifted you</p>
    <p style="font-size:32px;font-weight:800;color:#1f8a3b;margin:6px 0">${money(amount)}</p>
    <p style="color:#68756b;font-size:14px;margin:10px 0 18px">Welcome bonus to help you start your life in Niger State.</p>
    <button class="big" onclick="closeGift()">Collect</button>
  </div>`;
  document.body.appendChild(o);
}
function closeGift(){
  let o=document.getElementById("giftPopup");
  if(o)o.remove();
}
function maybeShowWelcomeGift(){
  if(!S||S.welcomeGift)return;
  S.welcomeGift=true;
  S.cash+=1000000;
  say("Niger Life gifted you "+money(1000000)+" as a welcome bonus!");
  save();
  setTimeout(()=>showGiftPopup(1000000),800);
}
function beginGame(){let p=AUTH.prize,a=AUTH.av;if(!p)return;S={name:AUTH.username,cash:p.cash,energy:100,food:80,day:1,town:"minna",home:p.home,xp:p.xp||0,items:Object.assign({},p.items||{}),biz:Object.assign({},p.biz||{}),learn:Object.assign({},p.learn||{}),furn:{},avatar:a,prize:p.id,spun:true,log:["Welcome to Niger Life, @"+AUTH.username+"! You are: "+p.title+"."]};hideAuth();spawnAt("minna");save();flushSave();startMp();joinTown();render();maybeShowWelcomeGift();}
function drawAuth(){let e=authEl(),st=AUTH.step,sc=e.scrollTop;if(st==="look"&&e.getAttribute("data-step")==="look"&&document.getElementById("avc"))return;e.setAttribute("data-step",st);let h="";
if(st==="boot")h='<div style="margin:auto;text-align:center;padding:30px"><div style="font-size:60px">🇳🇬</div><h1 style="margin:6px 0">Niger Life</h1><p class="muted">Loading…</p></div>';
else if(st==="welcome")h=`<div style="margin:auto 0 0;padding:28px 24px 12px;text-align:center"><div style="font-size:68px">🇳🇬</div><h1 style="font-size:34px;margin:8px 0 6px">Welcome to Niger Life</h1><p class="muted" style="font-size:16px">Live a whole life in Niger State. Work, hustle, build your house, buy a vehicle and meet other players in Minna, Bida, Suleja, Kontagora and New Bussa.</p><div class="err" id="aerr">${esc(AUTH.err)}</div></div><div class="sheet"><button class="big" onclick="showAuth('signup')">Create account</button><button class="big" style="background:#1c2233;margin-top:10px" onclick="showAuth('login')">Log in</button><p class="muted" style="text-align:center;font-size:12px;margin:10px 0 0">For ages 16 and above</p></div>`;
else if(st==="signup")h=`<div class="ah"><button class="ib" onclick="showAuth('welcome')">‹</button><h3>Create your account</h3><span style="width:44px"></span></div><div class="sheet" style="margin:12px 10px;border-radius:26px"><div class="lb">Full name</div><input class="field" id="fFull" autocomplete="name" placeholder="e.g. Amina Musa Bello"><div class="lb">Username</div><input class="field" id="fUser" autocapitalize="none" autocomplete="username" maxlength="16" placeholder="e.g. amina_minna"><div class="lb">Password</div><div style="position:relative"><input class="field" id="fPass" type="password" autocomplete="new-password" placeholder="At least 6 characters"><button type="button" class="ib" style="position:absolute;right:6px;top:8px;width:36px;height:36px;font-size:16px" onclick="togglePass()">👁</button></div><div class="lb">Date of birth (16+ only)</div><input class="field" id="fDob" type="date" max="${maxDob()}"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 4px"><input type="checkbox" id="fAgree" style="width:24px;height:24px;padding:0;margin:0;flex:none"><span>I have read and agree to the <a href="#" onclick="showTerms();return false">Terms and Privacy Notice</a>.</span></label><div class="err" id="aerr"></div><button class="big" id="abtn" onclick="doSignup()">Continue</button></div>`;
else if(st==="login")h=`<div class="ah"><button class="ib" onclick="showAuth('welcome')">‹</button><h3>Log in</h3><span style="width:44px"></span></div><div class="sheet" style="margin:12px 10px;border-radius:26px"><div class="lb">Username</div><input class="field" id="fUser" autocapitalize="none" autocomplete="username" placeholder="your username"><div class="lb">Password</div><div style="position:relative"><input class="field" id="fPass" type="password" autocomplete="current-password" placeholder="your password"><button type="button" class="ib" style="position:absolute;right:6px;top:8px;width:36px;height:36px;font-size:16px" onclick="togglePass()">👁</button></div><div class="err" id="aerr"></div><button class="big" id="abtn" onclick="doLogin()">Log in</button><p style="text-align:center;margin:12px 0 0"><a href="#" onclick="showAuth('signup');return false">New here? Create account</a></p></div>`;
else if(st==="look")h=`<div class="ah"><button class="ib" onclick="if(confirm('Log out?'))logout()">‹</button><div style="text-align:center"><h3>Look</h3><div class="prog"><i class="on"></i><i></i><i></i></div></div><div style="display:flex;gap:8px"><button class="ib" onclick="shuffleLook()">🔀</button><button class="go" onclick="lookNext()">Next</button></div></div><div style="display:flex;justify-content:center;align-items:center;min-height:330px;position:relative"><canvas id="avc" width="300" height="360" style="touch-action:none;max-width:74vw;height:auto"></canvas><div class="muted" style="position:absolute;bottom:2px;width:100%;text-align:center;font-size:13px">Drag to spin</div></div><div class="sheet" id="lookSheet">${lookSheet()}</div>`;
else if(st==="spin")h=wheelHTML();
e.innerHTML=h;e.scrollTop=(st==="look"||st==="spin")?0:sc;if(st==="look")initAv();if(st==="spin")drawWheel(AUTH.wang||0)}
function setupFirebase(){showAuth("boot");try{if(!window.firebase){authFail("Could not reach the game server. Check your internet and refresh.");return}if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().onAuthStateChanged(onUser)}catch(e){authFail("Could not start the game. Refresh the page.")}}

function setMpStatus(t){mpText=t;let e=document.getElementById("mpStatus");if(e)e.textContent=t}
function syncPlayer(){if(!db||!uid||!S)return;try{db.ref("players/"+uid).update({name:S.name,cash:Math.round(net())||0,town:S.town,day:S.day}).catch(e=>setMpStatus("Could not save your score: "+((e&&e.code)||"error")))}catch(e){}}
function watchMultiplayer(){if(!db)return;setMpStatus("Multiplayer connected.");db.ref("online/all").on("value",sn=>{onlineAll=sn.numChildren();updateOnl()},()=>{});
db.ref("players").orderByChild("cash").limitToLast(10).on("value",snap=>{let list=[];snap.forEach(c=>list.unshift(c.val()));boardHTML=list.length?list.map((p,i)=>`<div class="row"><div>${i+1}. ${esc(p.name||"Player")}<small>${esc((TOWNS[p.town]||{name:"Unknown"}).name)}</small></div><b>${money(p.cash||0)}</b></div>`).join(""):'<p class="muted">No players yet.</p>';let el=document.getElementById("leaderboard");if(el)el.innerHTML=boardHTML},()=>setMpStatus("Leaderboard unavailable: check Firebase Realtime Database rules."));
if(S){syncPlayer();joinTown()}}
function loadChat(){if(!db||!S)return;if(chatRef)chatRef.off();chatHTML='<p class="muted">No messages yet.</p>';chatRef=db.ref("chat/"+S.town).limitToLast(20);chatRef.on("value",snap=>{let arr=[];snap.forEach(c=>arr.push(c.val()));chatHTML=arr.length?arr.map(m=>`<p><b>${esc(m.n||"Player")}:</b> ${esc(m.m||"")}</p>`).join(""):'<p class="muted">No messages yet.</p>';let el=document.getElementById("chat");if(el){el.innerHTML=chatHTML;el.scrollTop=el.scrollHeight}},()=>setMpStatus("Chat unavailable until Firebase database rules are configured."))}
function watchPlayers(){if(!db||!S)return;if(posTown){db.ref("positions/"+posTown).off();db.ref("positions/"+posTown+"/"+uid).remove()}posTown=S.town;others={};let r=db.ref("positions/"+posTown);r.on("value",snap=>{let o={};snap.forEach(c=>{let v=c.val();if(c.key!==uid&&v&&typeof v.x==="number"&&typeof v.y==="number")o[c.key]=v});others=o;updateSend();updateOnl();drawWorld()},()=>{});r.child(uid).onDisconnect().remove()}
function pushPos(force){if(!db||!S||!posTown)return;let now=Date.now();if(!force&&now-lastPos<350)return;lastPos=now;db.ref("positions/"+posTown+"/"+uid).set({n:S.name.slice(0,12),x:Math.round(px),y:Math.round(py),v:(best()?best()[3]:""),t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})}
function leavePos(){if(db&&uid&&posTown){db.ref("positions/"+posTown).off();db.ref("positions/"+posTown+"/"+uid).remove();posTown=null;others={}}}
function joinTown(){BB={};loadChat();watchPlayers();pushPos(true);watchInbox();setPresence();if(db){if(bbRef)bbRef.off();bbRef=db.ref("billboards/"+S.town);bbRef.on("value",sn=>{BB=sn.val()||{};drawWorld()},()=>{})}}
function sendChat(){let i=document.getElementById("chatInput");if(!i||!db||!S){alert("Chat is not connected yet. The game itself still works.");return}let m=i.value.trim().slice(0,120);if(!m)return;i.value="";db.ref("chat/"+S.town).push({n:S.name,m,t:firebase.database.ServerValue.TIMESTAMP}).catch(e=>{let c=(e&&e.code)||"error";setMpStatus("Could not send chat: "+c);alert("Message not sent: "+c)})}
S=null;render();setupFirebase();let lastT=0;function loop(t){if(t-lastT>55){lastT=t;tick()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
